<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍智慧收支與累計盈餘管理系統</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (xlsx) for Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary-dark: #1e293b;
      --primary-color: #0f172a;
      --accent-blue: #3b82f6;
      --success-green: #10b981;
      --danger-red: #ef4444;
      --warning-amber: #f59e0b;
      --bg-slate: #f8fafc;
      --card-border: #e2e8f0;
    }
    body {
      background-color: var(--bg-slate);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #334155;
    }
    .navbar-custom {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .card-kpi {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
    }
    .card-kpi:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }
    .kpi-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .filter-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .text-profit { color: var(--success-green) !important; }
    .text-loss { color: var(--danger-red) !important; }
    
    .panel-box {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      height: 100%;
    }
    .badge-income {
      background-color: #d1fae5;
      color: #065f46;
      font-weight: 600;
    }
    .badge-expense {
      background-color: #fee2e2;
      color: #991b1b;
      font-weight: 600;
    }
    .table-custom th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    /* Zero Dependency Custom Modal */
    .custom-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .custom-modal-backdrop.active {
      display: flex;
    }
    .custom-modal-content {
      background: #ffffff;
      border-radius: 20px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4 py-3">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="#">
        <i class="fa-solid fa-building-circle-check text-info me-3 fs-3"></i>
        <span>宿舍智慧收支與累計盈餘管理系統</span>
      </a>
      <div class="d-flex align-items-center">
        <!-- Client Master Button -->
        <button class="btn btn-outline-info fw-bold px-3 py-2 me-2 shadow-sm" onclick="openClientModal()">
          <i class="fa-solid fa-address-book me-2"></i>客戶主檔維護
        </button>

        <!-- Robust File Upload Label -->
        <label class="btn btn-success fw-bold px-3 py-2 me-2 shadow-sm mb-0 style-cursor-pointer">
          <i class="fa-solid fa-file-excel me-2"></i>匯入 Excel 檔案
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
        </label>
        
        <button class="btn btn-outline-light px-3 py-2 me-2" onclick="downloadSampleExcel()">
          <i class="fa-solid fa-download me-2"></i>下載範本
        </button>
        <button class="btn btn-outline-danger px-3 py-2" onclick="resetSystemData()">
          <i class="fa-solid fa-trash me-2"></i>重置資料
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    
    <!-- Step-by-Step Linked Filter Bar -->
    <div class="filter-card p-3 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <label class="form-label fw-bold small text-muted mb-1"><i class="fa-solid fa-user-tie me-1 text-primary"></i>1. 選擇客戶 / 雇主</label>
          <select id="filterClient" class="form-select form-select-lg fs-6" onchange="onClientChange()">
            <option
