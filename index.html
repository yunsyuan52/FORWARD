<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍智慧收支與累計盈餘管理系統</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (xlsx) for Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary-dark: #1e293b;
      --primary-color: #0f172a;
      --accent-blue: #3b82f6;
      --success-green: #10b981;
      --danger-red: #ef4444;
      --warning-amber: #f59e0b;
      --bg-slate: #f8fafc;
      --card-border: #e2e8f0;
    }
    body {
      background-color: var(--bg-slate);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #334155;
    }
    .navbar-custom {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .card-kpi {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transition: all 0.25s ease;
    }
    .card-kpi:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
    }
    .kpi-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .filter-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .text-profit { color: var(--success-green) !important; }
    .text-loss { color: var(--danger-red) !important; }
    
    .panel-box {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      height: 100%;
    }
    .badge-income {
      background-color: #d1fae5;
      color: #065f46;
      font-weight: 600;
    }
    .badge-expense {
      background-color: #fee2e2;
      color: #991b1b;
      font-weight: 600;
    }
    .table-custom th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4 py-3">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="#">
        <i class="fa-solid fa-building-circle-check text-info me-3 fs-3"></i>
        <span>宿舍智慧收支與累計盈餘管理系統</span>
      </a>
      <div class="d-flex align-items-center">
        <button class="btn btn-success fw-bold px-3 py-2 me-2 shadow-sm" onclick="triggerFileInput()">
          <i class="fa-solid fa-file-excel me-2"></i>匯入 Excel 檔案
        </button>
        <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
        
        <button class="btn btn-outline-light px-3 py-2 me-2" onclick="downloadSampleExcel()">
          <i class="fa-solid fa-download me-2"></i>下載範本
        </button>
        <button class="btn btn-outline-danger px-3 py-2" onclick="resetSystemData()">
          <i class="fa-solid fa-trash me-2"></i>重置資料
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    
    <!-- Step-by-Step Linked Filter Bar -->
    <div class="filter-card p-3 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <label class="form-label fw-bold small text-muted mb-1"><i class="fa-solid fa-user-tie me-1 text-primary"></i>1. 選擇客戶 / 雇主</label>
          <select id="filterClient" class="form-select form-select-lg fs-6" onchange="onClientChange()">
            <option value="ALL">全部客戶</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold small text-muted mb-1"><i class="fa-solid fa-house me-1 text-success"></i>2. 選擇宿舍 (連動雇主)</label>
          <select id="filterDorm" class="form-select form-select-lg fs-6" onchange="onFilterChange()">
            <option value="ALL">全部宿舍</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold small text-muted mb-1"><i class="fa-solid fa-calendar-days me-1 text-warning"></i>3. 選擇月份</label>
          <select id="filterMonth" class="form-select form-select-lg fs-6" onchange="onFilterChange()">
            <!-- Dynamically populated -->
          </select>
        </div>
      </div>
    </div>

    <!-- Executive KPI Cards Grid -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card-kpi p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="text-muted fw-bold small">當月總收入</span>
            <div class="kpi-icon-box bg-success bg-opacity-10 text-success">
              <i class="fa-solid fa-sack-dollar"></i>
            </div>
          </div>
          <div class="h3 fw-bold text-success mb-1" id="statIncome">$0</div>
          <div class="small text-muted" id="statIncomeDesc">含移工託管費與宿舍各項應收</div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card-kpi p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="text-muted fw-bold small">當月總支出</span>
            <div class="kpi-icon-box bg-danger bg-opacity-10 text-danger">
              <i class="fa-solid fa-receipt"></i>
            </div>
          </div>
          <div class="h3 fw-bold text-danger mb-1" id="statExpense">$0</div>
          <div class="small text-muted" id="statExpenseDesc">含房東租金、維修修繕與保險網路</div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card-kpi p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="text-muted fw-bold small">當月損益 (淨盈虧)</span>
            <div class="kpi-icon-box bg-info bg-opacity-10 text-info">
              <i class="fa-solid fa-scale-balanced"></i>
            </div>
          </div>
          <div class="h3 fw-bold mb-1" id="statMonthlyPL">$0</div>
          <div class="small text-muted" id="statPLDesc">當月收入 - 當月支出</div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card-kpi p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="text-muted fw-bold small">歷史累計盈餘</span>
            <div class="kpi-icon-box bg-primary bg-opacity-10 text-primary">
              <i class="fa-solid fa-piggy-bank"></i>
            </div>
          </div>
          <div class="h3 fw-bold text-primary mb-1" id="statCumulative">$0</div>
          <div class="small text-muted">開業至今選定範圍累計純收益</div>
        </div>
      </div>
    </div>

    <!-- Monthly Detailed Breakdowns (Left: Income, Right: Expense) -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="panel-box">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-success mb-0 d-flex align-items-center">
              <i class="fa-solid fa-circle-plus me-2"></i>當月收入 / 託管費明細
            </h5>
            <span class="badge badge-income fs-6 px-3 py-2" id="incomeSubtotal">小計: $0</span>
          </div>
          <div class="table-responsive" style="max-height: 320px; overflow-y: auto;">
            <table class="table table-hover align-middle table-sm table-custom">
              <thead class="sticky-top">
                <tr>
                  <th>對象/人員</th>
                  <th>宿舍別</th>
                  <th>計費區間</th>
                  <th class="text-end">金額</th>
                </tr>
              </thead>
              <tbody id="incomeBreakdownBody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="panel-box">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-danger mb-0 d-flex align-items-center">
              <i class="fa-solid fa-circle-minus me-2"></i>當月支出 / 營運費用明細
            </h5>
            <span class="badge badge-expense fs-6 px-3 py-2" id="expenseSubtotal">小計: $0</span>
          </div>
          <div class="table-responsive" style="max-height: 320px; overflow-y: auto;">
            <table class="table table-hover align-middle table-sm table-custom">
              <thead class="sticky-top">
                <tr>
                  <th>日期</th>
                  <th>宿舍別</th>
                  <th>支出品項 / 原因</th>
                  <th class="text-end">金額</th>
                </tr>
              </thead>
              <tbody id="expenseBreakdownBody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts Section -->
    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <div class="panel-box">
          <h5 class="fw-bold mb-3 d-flex align-items-center"><i class="fa-solid fa-chart-line me-2 text-primary"></i>全年度收支與損益走勢圖</h5>
          <canvas id="annualTrendChart" height="130"></canvas>
        </div>
      </div>
      <div class="col-md-4">
        <div class="panel-box">
          <h5 class="fw-bold mb-3 d-flex align-items-center"><i class="fa-solid fa-chart-pie me-2 text-warning"></i>當月支出類別佔比</h5>
          <canvas id="expenseCategoryChart" height="240"></canvas>
        </div>
      </div>
    </div>

    <!-- Full Database View -->
    <div class="panel-box mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0 d-flex align-items-center"><i class="fa-solid fa-database me-2 text-dark"></i>完整收支明細資料庫</h5>
        <input type="text" id="tableSearch" class="form-control w-auto" placeholder="搜尋關鍵字、姓名、品項..." onkeyup="renderMainTable()">
      </div>
      <div class="table-responsive" style="max-height: 420px; overflow-y: auto;">
        <table class="table table-hover align-middle table-custom">
          <thead class="sticky-top">
            <tr>
              <th>日期 / 區間</th>
              <th>客戶 (雇主)</th>
              <th>宿舍名稱</th>
              <th>收支類型</th>
              <th>對象 / 品項內容</th>
              <th class="text-end">金額</th>
            </tr>
          </thead>
          <tbody id="mainTableBody">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // System Master Data Storage
    let masterData = [
      { id: 1, date: '115/10/01', period: '10/1~10/31', client: 'APPLE', dorm: '復興宿舍', type: '收入', detail: '陳氏海燕 (託管費)', amount: 2700 },
      { id: 2, date: '115/10/05', period: '-', client: 'APPLE', dorm: '福安宿舍', type: '支出', detail: '租金10/1~10/31', amount: 6000 },
      { id: 3, date: '115/10/28', period: '-', client: 'orange', dorm: '中原宿舍', type: '支出', detail: '更換浴室燈座+燈泡', amount: 336 }
    ];

    let trendChart = null;
    let categoryChart = null;

    window.onload = function() {
      initClientDropdown();
      onClientChange();
    };

    function triggerFileInput() {
      let input = document.getElementById('excelFileInput');
      input.value = ''; // Reset input so same file can be uploaded again
      input.click();
    }

    function normalizeMonthStr(dateStr) {
      if (!dateStr) return '未知月份';
      let parts = dateStr.toString().trim().split(/[\/\-]/);
      if (parts.length >= 2) {
        let year = parts[0];
        let month = parts[1].padStart(2, '0');
        return `${year}年${month}月`;
      }
      return dateStr;
    }

    // Dynamic Expense Parser Anchor by "宿舍"
    function parseExpenseContent(rawContent) {
      let str = rawContent.toString().trim();
      let client = 'APPLE';
      let dorm = '綜合宿舍';
      let detail = str;

      let dormIdx = str.indexOf('宿舍');
      if (dormIdx !== -1) {
        let prefix = str.substring(0, dormIdx); 
        detail = str.substring(dormIdx + 2).trim(); 

        let match = prefix.match(/^([a-zA-Z0-9_\-\s]+)(.*)$/);
        if (match) {
          client = match[1].trim();
          dorm = match[2].trim() ? match[2].trim() + '宿舍' : '宿舍';
        } else {
          dorm = prefix + '宿舍';
        }
      } else {
        let knownClients = ['APPLE', 'BANANA', 'ORANGE', 'CARRY', 'MANGO'];
        for (let c of knownClients) {
          if (str.toUpperCase().includes(c)) {
            client = (c === 'ORANGE') ? 'orange' : c;
            str = str.replace(new RegExp(c, 'gi'), '');
            break;
          }
        }
        detail = str.trim();
      }

      if (!detail) detail = '宿舍開支';
      return { client, dorm, detail };
    }

    // Initialize Client Dropdown
    function initClientDropdown() {
      let clients = new Set();
      masterData.forEach(item => {
        if (item.client) clients.add(item.client);
      });

      let clientSelect = document.getElementById('filterClient');
      let curr = clientSelect.value;
      clientSelect.innerHTML = '<option value="ALL">全部客戶</option>';
      Array.from(clients).sort().forEach(c => {
        clientSelect.innerHTML += `<option value="${c}">${c}</option>`;
      });
      if (Array.from(clients).includes(curr)) clientSelect.value = curr;
    }

    // Client Linkage Event: Filter Dormitories
    function onClientChange() {
      let selectedClient = document.getElementById('filterClient').value;
      let dormSelect = document.getElementById('filterDorm');
      dormSelect.innerHTML = '<option value="ALL">全部宿舍</option>';

      let availableDorms = new Set();
      masterData.forEach(item => {
        if (selectedClient === 'ALL' || item.client === selectedClient) {
          if (item.dorm) availableDorms.add(item.dorm);
        }
      });

      Array.from(availableDorms).sort().forEach(d => {
        dormSelect.innerHTML += `<option value="${d}">${d}</option>`;
      });

      // Populate Months
      initMonthDropdown();
      onFilterChange();
    }

    function initMonthDropdown() {
      let months = new Set();
      masterData.forEach(item => {
        if (item.date) months.add(normalizeMonthStr(item.date));
      });

      let monthSelect = document.getElementById('filterMonth');
      let curr = monthSelect.value;
      monthSelect.innerHTML = '';
      Array.from(months).sort().reverse().forEach(m => {
        monthSelect.innerHTML += `<option value="${m}">${m}</option>`;
      });

      if (months.size > 0 && monthSelect.options.length > 0) {
        if (Array.from(months).includes(curr)) monthSelect.value = curr;
        else monthSelect.selectedIndex = 0;
      }
    }

    function getFilteredData() {
      let client = document.getElementById('filterClient').value;
      let dorm = document.getElementById('filterDorm').value;

      return masterData.filter(item => {
        let matchClient = (client === 'ALL' || item.client === client);
        let matchDorm = (dorm === 'ALL' || item.dorm === dorm);
        return matchClient && matchDorm;
      });
    }

    function onFilterChange() {
      let scopeData = getFilteredData();
      let selectedMonth = document.getElementById('filterMonth').value;

      let monthData = scopeData.filter(item => normalizeMonthStr(item.date) === selectedMonth);
      let incTotal = monthData.filter(i => i.type === '收入').reduce((a, b) => a + b.amount, 0);
      let expTotal = monthData.filter(i => i.type === '支出').reduce((a, b) => a + b.amount, 0);
      let monthlyPL = incTotal - expTotal;

      document.getElementById('statIncome').innerText = '$' + incTotal.toLocaleString();
      document.getElementById('statExpense').innerText = '$' + expTotal.toLocaleString();

      let plEl = document.getElementById('statMonthlyPL');
      if (monthlyPL < 0) {
        plEl.innerText = '-$' + Math.abs(monthlyPL).toLocaleString();
        plEl.className = 'h3 fw-bold mb-1 text-loss';
        document.getElementById('statPLDesc').innerText = `當月淨虧損 $${Math.abs(monthlyPL).toLocaleString()}`;
      } else {
        plEl.innerText = '+$' + monthlyPL.toLocaleString();
        plEl.className = 'h3 fw-bold mb-1 text-profit';
        document.getElementById('statPLDesc').innerText = `當月淨盈餘 $${monthlyPL.toLocaleString()}`;
      }

      let cumInc = scopeData.filter(i => i.type === '收入').reduce((a, b) => a + b.amount, 0);
      let cumExp = scopeData.filter(i => i.type === '支出').reduce((a, b) => a + b.amount, 0);
      let cumSurplus = cumInc - cumExp;
      let cumEl = document.getElementById('statCumulative');
      cumEl.innerText = (cumSurplus >= 0 ? '+$' : '-$') + Math.abs(cumSurplus).toLocaleString();
      cumEl.className = cumSurplus >= 0 ? 'h3 fw-bold mb-1 text-primary' : 'h3 fw-bold mb-1 text-loss';

      renderBreakdowns(monthData, incTotal, expTotal);
      renderMainTable();
      updateCharts(scopeData, monthData);
    }

    function renderBreakdowns(monthData, incTotal, expTotal) {
      document.getElementById('incomeSubtotal').innerText = '小計: $' + incTotal.toLocaleString();
      document.getElementById('expenseSubtotal').innerText = '小計: $' + expTotal.toLocaleString();

      let incBody = document.getElementById('incomeBreakdownBody');
      incBody.innerHTML = '';
      let incItems = monthData.filter(i => i.type === '收入');
      if (incItems.length === 0) {
        incBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">無收入紀錄</td></tr>';
      } else {
        incItems.forEach(item => {
          incBody.innerHTML += `
            <tr>
              <td class="fw-bold">${item.detail || '未指定'}</td>
              <td>${item.dorm || '-'}</td>
              <td><span class="badge bg-light text-dark border">${item.period || '全月'}</span></td>
              <td class="text-end text-success fw-bold">+$${item.amount.toLocaleString()}</td>
            </tr>
          `;
        });
      }

      let expBody = document.getElementById('expenseBreakdownBody');
      expBody.innerHTML = '';
      let expItems = monthData.filter(i => i.type === '支出');
      if (expItems.length === 0) {
        expBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">無支出紀錄</td></tr>';
      } else {
        expItems.forEach(item => {
          expBody.innerHTML += `
            <tr>
              <td>${item.date}</td>
              <td>${item.dorm || '-'}</td>
              <td class="fw-bold text-dark">${item.detail || '雜項支出'}</td>
              <td class="text-end text-danger fw-bold">-$${item.amount.toLocaleString()}</td>
            </tr>
          `;
        });
      }
    }

    function renderMainTable() {
      let scopeData = getFilteredData();
      let query = document.getElementById('tableSearch').value.toLowerCase();
      let tbody = document.getElementById('mainTableBody');
      tbody.innerHTML = '';

      let filtered = scopeData.filter(i => 
        (i.detail && i.detail.toLowerCase().includes(query)) ||
        (i.dorm && i.dorm.toLowerCase().includes(query)) ||
        (i.client && i.client.toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">無符合資料</td></tr>';
        return;
      }

      filtered.forEach(item => {
        let isInc = item.type === '收入';
        tbody.innerHTML += `
          <tr>
            <td>${item.date} ${item.period && item.period !== '-' ? `<small class="text-muted">(${item.period})</small>` : ''}</td>
            <td><span class="badge bg-secondary">${item.client || '-'}</span></td>
            <td class="fw-bold">${item.dorm || '-'}</td>
            <td><span class="badge ${isInc ? 'badge-income' : 'badge-expense'}">${item.type}</span></td>
            <td>${item.detail}</td>
            <td class="text-end fw-bold ${isInc ? 'text-success' : 'text-danger'}">
              ${isInc ? '+' : '-'}$${item.amount.toLocaleString()}
            </td>
          </tr>
        `;
      });
    }

    function updateCharts(scopeData, monthData) {
      let monthsMap = {};
      scopeData.forEach(item => {
        let m = normalizeMonthStr(item.date);
        if (!monthsMap[m]) monthsMap[m] = { inc: 0, exp: 0 };
        if (item.type === '收入') monthsMap[m].inc += item.amount;
        else monthsMap[m].exp += item.amount;
      });

      let labels = Object.keys(monthsMap).sort();
      let incSeries = labels.map(l => monthsMap[l].inc);
      let expSeries = labels.map(l => monthsMap[l].exp);
      let plSeries = labels.map(l => monthsMap[l].inc - monthsMap[l].exp);

      if (trendChart) trendChart.destroy();
      let ctx1 = document.getElementById('annualTrendChart').getContext('2d');
      trendChart = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: '總收入', data: incSeries, backgroundColor: '#10b981' },
            { label: '總支出', data: expSeries, backgroundColor: '#ef4444' },
            { label: '當月淨利', data: plSeries, type: 'line', borderColor: '#3b82f6', fill: false, borderWidth: 3 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      let expCategoryMap = {};
      monthData.filter(i => i.type === '支出').forEach(i => {
        let cat = '修繕維修';
        let d = i.detail.toLowerCase();
        if (d.includes('租金')) cat = '房屋租金';
        else if (d.includes('網路')) cat = '網路通訊';
        else if (d.includes('保險')) cat = '公共保險';
        else if (d.includes('設備') || d.includes('洗衣機') || d.includes('燈') || d.includes('監視器')) cat = '設備採購';
        
        expCategoryMap[cat] = (expCategoryMap[cat] || 0) + i.amount;
      });

      if (categoryChart) categoryChart.destroy();
      let ctx2 = document.getElementById('expenseCategoryChart').getContext('2d');
      categoryChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: Object.keys(expCategoryMap).length > 0 ? Object.keys(expCategoryMap) : ['無支出'],
          datasets: [{
            data: Object.keys(expCategoryMap).length > 0 ? Object.values(expCategoryMap) : [1],
            backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#8b5cf6', '#64748b']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Universal Excel Import Engine
    function handleExcelUpload(e) {
      let file = e.target.files[0];
      if (!file) return;

      let reader = new FileReader();
      reader.onload = function(evt) {
        try {
          let data = new Uint8Array(evt.target.result);
          let workbook = XLSX.read(data, { type: 'array' });
          
          let incCount = 0;
          let expCount = 0;
          let newRecords = [];

          workbook.SheetNames.forEach(sheetName => {
            let sheet = workbook.Sheets[sheetName];
            let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

            rows.forEach((row) => {
              if (!row || row.length === 0) return;
              let rowStrArr = row.map(cell => (cell !== null && cell !== undefined) ? cell.toString().trim() : '');

              // 1. Check Expense Pattern
              let hasDate = false;
              let dateStr = '';
              let contentStr = '';
              let numAmount = null;

              for (let i = 0; i < rowStrArr.length; i++) {
                let cell = rowStrArr[i];
                if (!hasDate && cell.match(/\d{2,3}[\/\-]\d{1,2}[\/\-]\d{1,2}/)) {
                  hasDate = true;
                  dateStr = cell;
                } else if (cell.length > 2 && !cell.match(/^\d+$/) && cell !== '內容' && cell !== '日期') {
                  contentStr = cell;
                } else if (!isNaN(parseFloat(cell.replace(/,/g, ''))) && parseFloat(cell.replace(/,/g, '')) !== 0 && !cell.match(/\d+[\/\-]\d+/)) {
                  numAmount = parseFloat(cell.replace(/,/g, ''));
                }
              }

              if (hasDate && contentStr && numAmount !== null) {
                let parsed = parseExpenseContent(contentStr);
                newRecords.push({
                  id: Date.now() + Math.random(),
                  date: dateStr,
                  period: '-',
                  client: parsed.client,
                  dorm: parsed.dorm,
                  type: '支出',
                  detail: parsed.detail,
                  amount: numAmount
                });
                expCount++;
                return;
              }

              // 2. Check Income Pattern
              let personName = rowStrArr[0];
              let dormNameRaw = rowStrArr[2];
              let feeVal = rowStrArr[3] || rowStrArr[5];
              let periodVal = rowStrArr[6] || rowStrArr[4] || '10/1~10/31';

              if (personName && personName !== '姓名' && personName !== '合計金額' && !personName.includes('Billing Detail') && !personName.includes('灃康') && !personName.includes('Forward') && !personName.includes('本期應收') && feeVal) {
                let amt = parseFloat(feeVal.replace(/,/g, ''));
                if (!isNaN(amt) && amt > 0) {
                  let dormFormatted = '綜合宿舍';
                  if (dormNameRaw) {
                    dormFormatted = dormNameRaw.includes('宿舍') ? dormNameRaw : dormNameRaw + '宿舍';
                  }

                  newRecords.push({
                    id: Date.now() + Math.random(),
                    date: '115/10/01',
                    period: periodVal,
                    client: 'APPLE',
                    dorm: dormFormatted,
                    type: '收入',
                    detail: `${personName} (託管費)`,
                    amount: amt
                  });
                  incCount++;
                }
              }
            });
          });

          if (newRecords.length > 0) {
            masterData = masterData.concat(newRecords);
            alert(`🎉 成功匯入資料！\n\n• 收入項目：${incCount} 筆\n• 支出項目：${expCount} 筆`);
            initClientDropdown();
            onClientChange();
          } else {
            alert('⚠️ 無法自動識別此 Excel 內的項目，請確認格式。');
          }

        } catch (err) {
          alert('❌ 檔案解析失敗：' + err.message);
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function downloadSampleExcel() {
      let sampleData = [
        ["日期", "內容", "支出"],
        ["115/10/05", "APPLE福安宿舍租金10/1~10/31", 6000],
        ["115/10/28", "orange中原宿舍更換浴室燈座+燈泡", 336]
      ];
      let ws = XLSX.utils.aoa_to_sheet(sampleData);
      let wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "支出匯入範本");
      XLSX.writeFile(wb, "宿舍支出匯入範本.xlsx");
    }

    function resetSystemData() {
      if (confirm('確定要清空所有資料嗎？')) {
        masterData = [];
        initClientDropdown();
        onClientChange();
      }
    }
  </script>
